# The app itself. Three replicas, so the Service in 04-service.yml has
# something to load-balance across and so a deleted Pod visibly comes back.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: project-assigner
spec:
  replicas: 3
  selector:
    # This is the whole trick of a Deployment: it does not own a list of Pods,
    # it owns a label. Anything matching app=project-assigner is "mine", and it
    # keeps exactly `replicas` of them alive.
    matchLabels:
      app: project-assigner
  template:
    metadata:
      labels:
        app: project-assigner
    spec:
      # Docker Hub login for pulling the image. The Secret is namespaced, so
      # it must exist in every namespace this Deployment is applied to.
      imagePullSecrets:
        - name: regcred
      containers:
        - name: web
          image: hangrysingh/project-assigner:prod
          # :prod is a moving tag - the same name points at a new image on
          # every pipeline run. Always means re-check the registry each time,
          # instead of serving whatever the node happens to have cached.
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            - name: DATABASE_URL
              value: postgres://assigner:assigner@db:5432/assigner
            - name: REDIS_URL
              value: redis://cache:6379
          readinessProbe:
            # Until this passes the Pod is kept out of the Service's endpoint
            # list, so nobody is sent to a replica that cannot reach Postgres.
            httpGet:
              path: /api/health
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
